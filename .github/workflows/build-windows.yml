name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart pydantic pyfirmata pymupdf Pillow openpyxl ezdxf rapidocr_onnxruntime onnxruntime pywebview pyinstaller
          pip list | grep -E "rapidocr|onnx|pyinstaller|pywebview"

      - name: Verify imports
        run: |
          python -c "import rapidocr_onnxruntime; print('rapidocr OK')"
          python -c "import onnxruntime; print('onnx OK')"
          python -c "import pywebview; print('pywebview OK')"
          python -c "import uvicorn; print('uvicorn OK')"
          python -c "import fitz; print('fitz OK')"
          python -c "import ezdxf; print('ezdxf OK')"

      - name: Build EXE
        run: |
          pyinstaller --name BaboLocal `
            --onefile --windowed --noconfirm `
            --add-data "frontend;frontend" `
            --add-data "backend;backend" `
            --add-data "desktop;desktop" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import server `
            --hidden-import dxf_handler `
            --hidden-import pdf_handler `
            --hidden-import exporter `
            --hidden-import rapidocr_onnxruntime `
            --hidden-import rapidocr_onnxruntime.main `
            --hidden-import onnxruntime `
            --hidden-import onnxruntime.capi `
            --hidden-import fitz `
            --hidden-import ezdxf `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --collect-all rapidocr_onnxruntime `
            --collect-all onnxruntime `
            desktop\main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaboLocal-Windows
          path: dist/BaboLocal.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BaboLocal.exe
          name: BaboLocal ${{ github.ref_name }}
